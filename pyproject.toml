[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mouse"
version = "0.1.0"
description = "Fast, human-like AI mouse controller and UI automation MCP server for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "robertbeck-stack" }
]
dependencies = [
    "mcp>=2.3.0",
    "uiautomation>=2.0.29",
    "pywin32>=312",
    "anyio>=4.9.0"
]

[project.scripts]
ai-mouse-server = "ai_mouse.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deskdriver"
version = "0.2.0"
description = "DeskDriver - High-speed desktop automation & UI knowledge graph MCP server for Windows (like WebDriver, but for your Desktop)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "robertbeck-stack" }
]
dependencies = [
    "mcp>=2.3.0",
    "uiautomation>=2.0.29",
    "pywin32>=312",
    "anyio>=4.9.0"
]

[project.scripts]
deskdriver = "deskdriver.server:main"
deskdriver-server = "deskdriver.server:main"
ai-mouse-server = "deskdriver.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Unit tests only; tests/test_deskdriver.py drives real windows and is run directly
testpaths = ["tests/unit"]
